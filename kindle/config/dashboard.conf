#!/bin/sh

##############################################################################
# Kindle Dashboard Configuration
#
# Flat-sourced (`. dashboard.conf`) by fetch-dashboard.sh and
# dashboard-loop.sh — every key lands directly in the caller's variable
# namespace. NEVER add a key whose name shadows a script-local variable
# (this is why the loop's own log variable is LOOP_LOG, not LOG_FILE).
#
# Only keys actually read by the scripts live here. If you add a knob,
# wire it up in the consuming script in the same change.
##############################################################################

# --- Server ---

# Dashboard server hostname or IP (required — fetch fails loudly without it)
SERVER_HOST="192.168.50.163"

# Dashboard server port
SERVER_PORT="3000"

# Network timeout in seconds (informational: busybox wget has no --timeout)
TIMEOUT="30"

# Retry attempts for failed downloads
RETRIES="3"

# --- Paths ---

# Directory for dashboard images and logs (Kindle USB storage)
DASHBOARD_DIR="/mnt/us/dashboard"

# Log file for fetch-dashboard.sh (the loop logs to logs/dashboard-loop.log)
LOG_FILE="/mnt/us/dashboard/logs/fetch.log"

# Fallback image displayed when download and cached images all fail
# (must be a valid 600x800 grayscale PNG)
BACKUP_IMAGE="/mnt/us/dashboard/fallback.png"

# --- Schedule ---

# Seconds between fetches; the loop aligns to clock boundaries (300 = :00/:05/:10/...)
UPDATE_INTERVAL="300"

# Active hours (24h, Central Time) — outside this window the loop sleeps
# without fetching. Set both to 0 to fetch around the clock.
ACTIVE_HOURS_START="7"
ACTIVE_HOURS_END="22"

# UTC offset: -5 (CDT), -6 (CST), or "auto" for automatic US DST detection
UTC_OFFSET="auto"

##############################################################################
# Handy commands
#
#   Test config:            sh fetch-dashboard.sh --dry-run --verbose
#   Test connectivity:      wget --spider http://192.168.50.163:3000/health
#   Recent fetch log:       tail -20 /mnt/us/dashboard/logs/fetch.log
#   Recent loop log:        tail -20 /mnt/us/dashboard/logs/dashboard-loop.log
##############################################################################
