# Kindle Dashboard auto-start (upstart job)
#
# Install to /etc/upstart/dashboard.conf on the device. The rootfs is
# read-only, so installation must remount around the write:
#   ./deploy-kindle.sh --install-boot-job
# or by hand: mount -o remount,rw / ... mount -o remount,ro /
#
# ---------------------------------------------------------------------------
# Why "started lab126_gui" and not "started cron"
#
# crond starts BEFORE the FUSE mount that provides /mnt/us. Measured on the
# device 2026-08-07: crond pid 636, `fsp /mnt/base-us /mnt/us` pid 943. A job
# triggered on "started cron" therefore runs while /mnt/us/dashboard does not
# exist yet — the redirect below fails, the script block dies immediately, and
# nothing is logged anywhere. That is silent: no loop, no boot.log, no trace.
#
# This is why the dashboard did not come back on its own after the device was
# recharged and rebooted following the 2026-06-18 flat-battery shutdown. The
# previous job also used a bare `exec /mnt/us/dashboard/dashboard-loop.sh`,
# which cannot work regardless: /mnt/base-us is vfat,noexec and /mnt/us is a
# FUSE overlay, so the exec bit is meaningless there. Always invoke via `sh`.
#
# ---------------------------------------------------------------------------
# Why "stop on stopping system" and not "stop on stopping lab126_gui"
#
# start.sh stops the framework (lab126_gui) on purpose, to cut power draw.
# Pairing the start trigger with "stop on stopping lab126_gui" would make this
# job stop itself moments after boot, killing the dashboard loop it had just
# launched.

start on started lab126_gui
stop on stopping system

script
    # Belt and braces: wait for /mnt/us to actually be mounted before the
    # redirect below touches it, in case the trigger ever moves earlier.
    i=0
    while [ $i -lt 60 ]; do
        [ -f /mnt/us/dashboard/on-boot.sh ] && break
        sleep 2
        i=$((i + 1))
    done
    exec sh /mnt/us/dashboard/on-boot.sh >> /mnt/us/dashboard/logs/boot.log 2>&1
end script
